name: build

on:
  push:
    branches: [main]
    paths: ['fpm/**', '.github/workflows/build.yml']
  schedule:
    - cron: '0 5 * * *'      # pick up a release within a day even with no commit
  workflow_dispatch:
    inputs:
      php_version:
        description: 'Single PHP version to build, e.g. 8.5.12. Leave empty to build every supported branch.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/wp-php
  # Branches we no longer publish. 8.2 is security-only and reaches EOL on 31 Dec 2026, so it is
  # dropped from the matrix now rather than left to rot. Add a branch here when it reaches EOL.
  SKIP_BRANCHES: "8.2"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.php_version }}" ]; then
            echo 'versions=["${{ inputs.php_version }}"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Latest patch of every branch php.net still supports. Read from the API rather than a
          # hardcoded list, so a new security release is picked up by the nightly run.
          branches=$(curl -fsSL --retry 3 --retry-delay 2 \
            'https://www.php.net/releases/index.php?json&version=8' | jq -r '.supported_versions[]')
          [ -n "$branches" ] || { echo "::error::php.net reported no supported 8.x branches"; exit 1; }
          versions='[]'
          for b in $branches; do
            case " ${SKIP_BRANCHES} " in
              *" $b "*) echo "skip $b (listed in SKIP_BRANCHES)"; continue ;;
            esac
            v=$(curl -fsSL --retry 3 --retry-delay 2 \
              "https://www.php.net/releases/index.php?json&version=$b" | jq -r '.version')
            case "$v" in
              "$b".*) ;;
              *) echo "::error::php.net returned '$v' for branch $b"; exit 1 ;;
            esac
            versions=$(jq -c --arg v "$v" '. + [$v]' <<<"$versions")
          done
          [ "$versions" != "[]" ] || { echo "::error::no branches left to build - check SKIP_BRANCHES"; exit 1; }
          echo "resolved versions: $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.matrix.outputs.versions) }}
    # matrix values are only exposed through the `matrix` context; without this every
    # `$version` in the steps below expands to an empty string and the docker tag becomes
    # "ghcr.io/wzul/wp-php:" (invalid reference format).
    env:
      version: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: |
          MINOR="${version%.*}"
          docker build \
            -f fpm/Dockerfile.ext \
            --build-arg BASE="php:${version}-fpm-alpine" \
            -t "$REGISTRY/$IMAGE:${version}" \
            -t "$REGISTRY/$IMAGE:${MINOR}" \
            fpm/

      - name: Prove the tag matches the source version
        run: |
          got=$(docker run --rm "$REGISTRY/$IMAGE:${version}" php -r 'echo PHP_VERSION;')
          echo "image reports PHP $got, expected ${version}"
          test "$got" = "${version}"

      - name: Push
        run: |
          MINOR="${version%.*}"
          docker push "$REGISTRY/$IMAGE:${version}"
          docker push "$REGISTRY/$IMAGE:${MINOR}"
