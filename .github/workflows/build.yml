name: build

on:
  push:
    branches: [main]
    paths: ['fpm/**', '.github/workflows/build.yml']
  schedule:
    - cron: '0 5 * * *'      # pick up a release within a day even with no commit
  workflow_dispatch:
    inputs:
      php_version:
        description: 'Single PHP version to build, e.g. 8.5.12. Leave empty to build every supported branch.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/wp-php
  # Branches we publish. The fleet runs 8.5 in production and 8.6 ahead of GA; older branches
  # are dropped rather than left to rot (8.2 is EOL 31 Dec 2026, 8.3/8.4 are not used anywhere).
  SKIP_BRANCHES: "8.2 8.3 8.4"

  # Pre-release versions published ahead of a php.net GA. php.net only lists GA branches in
  # supported_versions, so an RC has to be named here until its branch appears there.
  EXTRA_VERSIONS: "8.6.0RC7"

  # No tagged release of these extensions compiles against PHP 8.6 yet (APCu changes the
  # php_verror signature, Imagick still calls XtOffsetOf, msgpack's zval checks regressed).
  # Pin the development commits that do compile, so an RC build is reproducible; replace each
  # with the released tag once upstream publishes one that supports 8.6.
  APCU_REF_86: fb2c942552a3f5dab7f4dea4afb5cf0831222c57
  REDIS_REF_86: 5b60b125aba347159b0c9c319296fbb3c5ed9214
  MSGPACK_REF_86: 4a6890850a9065f9a211951df4fc39c5a4c498ab
  IMAGICK_REF_86: 55ed2e9fda264395636a2e27e51f31673f5566ab

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.php_version }}" ]; then
            echo 'versions=["${{ inputs.php_version }}"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Latest patch of every branch php.net still supports. Read from the API rather than a
          # hardcoded list, so a new security release is picked up by the nightly run.
          branches=$(curl -fsSL --retry 3 --retry-delay 2 \
            'https://www.php.net/releases/index.php?json&version=8' | jq -r '.supported_versions[]')
          [ -n "$branches" ] || { echo "::error::php.net reported no supported 8.x branches"; exit 1; }
          versions='[]'
          for b in $branches; do
            case " ${SKIP_BRANCHES} " in
              *" $b "*) echo "skip $b (listed in SKIP_BRANCHES)"; continue ;;
            esac
            v=$(curl -fsSL --retry 3 --retry-delay 2 \
              "https://www.php.net/releases/index.php?json&version=$b" | jq -r '.version')
            case "$v" in
              "$b".*) ;;
              *) echo "::error::php.net returned '$v' for branch $b"; exit 1 ;;
            esac
            versions=$(jq -c --arg v "$v" '. + [$v]' <<<"$versions")
          done
          [ "$versions" != "[]" ] || { echo "::error::no branches left to build - check SKIP_BRANCHES"; exit 1; }

          # Pre-release builds (RC/beta). Skip any whose branch is already covered by a GA
          # resolution, so the nightly run stops adding the RC the day 8.6 ships.
          for x in ${EXTRA_VERSIONS:-}; do
            xb=$(echo "$x" | cut -d. -f1,2)
            if echo "$versions" | jq -e --arg p "$xb." 'any(.[]; startswith($p))' >/dev/null; then
              echo "skip extra $x ($xb already resolved from php.net)"
              continue
            fi
            echo "add extra $x"
            versions=$(jq -c --arg v "$x" '. + [$v]' <<<"$versions")
          done
          echo "resolved versions: $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.matrix.outputs.versions) }}
    # matrix values are only exposed through the `matrix` context; without this every
    # `$version` in the steps below expands to an empty string and the docker tag becomes
    # "ghcr.io/wzul/wp-php:" (invalid reference format).
    env:
      version: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: |
          # Pre-release versions must not move the floating minor tag (8.6 pointing at an RC
          # would silently upgrade anyone who pins `:8.6`).
          case "$version" in
            *RC*|*rc*|*beta*|*alpha*) MINOR="" ;;
            *) MINOR="${version%.*}" ;;
          esac

          # Extension sources: released tags normally, pinned dev commits for 8.6 pre-GA.
          case "$version" in
            8.6.*)
              REFS="--build-arg APCU_REF=$APCU_REF_86 --build-arg REDIS_REF=$REDIS_REF_86                     --build-arg MSGPACK_REF=$MSGPACK_REF_86 --build-arg IMAGICK_REF=$IMAGICK_REF_86" ;;
            *) REFS="" ;;
          esac

          TAGS="-t $REGISTRY/$IMAGE:${version}"
          if [ -n "$MINOR" ]; then TAGS="$TAGS -t $REGISTRY/$IMAGE:${MINOR}"; fi

          # shellcheck disable=SC2086
          docker build \
            -f fpm/Dockerfile.ext \
            --build-arg BASE="php:${version}-fpm-alpine" \
            $REFS \
            $TAGS \
            fpm/

      - name: Prove the tag matches the source version
        run: |
          got=$(docker run --rm "$REGISTRY/$IMAGE:${version}" php -r 'echo PHP_VERSION;')
          echo "image reports PHP $got, expected ${version}"
          test "$got" = "${version}"

      - name: Push
        run: |
          case "$version" in
            *RC*|*rc*|*beta*|*alpha*) MINOR="" ;;
            *) MINOR="${version%.*}" ;;
          esac
          docker push "$REGISTRY/$IMAGE:${version}"
          if [ -n "$MINOR" ]; then docker push "$REGISTRY/$IMAGE:${MINOR}"; fi
